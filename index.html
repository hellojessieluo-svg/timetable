<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>时间块</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="时间块">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <button id="prevBtn" class="iconbtn" aria-label="上个月">‹</button>
  <h1 id="monthTitle">2026年1月</h1>
  <button id="nextBtn" class="iconbtn" aria-label="下个月">›</button>
  <span class="spacer"></span>
  <button id="todayBtn" class="textbtn">今天</button>
  <button id="settingsBtn" class="iconbtn" aria-label="设置">⚙</button>
</header>

<div class="weekdays">
  <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span class="sun">日</span>
</div>

<main id="grid" class="grid"></main>

<div id="backdrop" class="backdrop hidden"></div>

<!-- 当天清单 -->
<section id="daySheet" class="sheet hidden" aria-label="当天">
  <div class="sheet-head">
    <h2 id="dayTitle">10月3日 周五</h2>
    <button class="iconbtn close" data-close="daySheet" aria-label="关闭">×</button>
  </div>
  <ul id="dayList" class="daylist"></ul>
  <div class="sheet-actions">
    <button id="addTodoBtn" class="btn">＋ 待办</button>
    <button id="addEventBtn" class="btn">＋ 日程</button>
  </div>
</section>

<!-- 新建 / 编辑 -->
<section id="editSheet" class="sheet hidden" aria-label="编辑">
  <div class="sheet-head">
    <h2 id="editTitle">新建</h2>
    <button class="iconbtn close" data-close="editSheet" aria-label="关闭">×</button>
  </div>
  <form id="editForm" autocomplete="off">
    <div class="seg" id="typeSeg">
      <button type="button" data-type="todo" class="on">待办</button>
      <button type="button" data-type="event">日程</button>
    </div>
    <input id="fTitle" class="input" type="text" placeholder="写点什么" maxlength="80" required>
    <div class="label">分类</div>
    <div id="fCats" class="chips"></div>
    <div class="row">
      <label class="field"><span>日期</span><input id="fDate" type="date" class="input" required></label>
    </div>
    <div class="row" id="timeRow">
      <label class="field"><span>开始</span><input id="fTime" type="time" class="input"></label>
      <label class="field"><span>结束</span><input id="fEnd" type="time" class="input"></label>
    </div>
    <div class="row">
      <label class="field"><span>重复</span>
        <select id="fRepeat" class="input">
          <option value="">不重复</option>
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
        </select>
      </label>
    </div>
    <div id="fDays" class="chips days hidden">
      <button type="button" data-d="1">一</button><button type="button" data-d="2">二</button><button type="button" data-d="3">三</button>
      <button type="button" data-d="4">四</button><button type="button" data-d="5">五</button><button type="button" data-d="6">六</button><button type="button" data-d="7">日</button>
    </div>
    <div class="sheet-actions">
      <button type="button" id="deleteBtn" class="btn danger hidden">删除</button>
      <span class="spacer"></span>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</section>

<!-- 设置 -->
<section id="settingsSheet" class="sheet hidden" aria-label="设置">
  <div class="sheet-head">
    <h2>设置</h2>
    <button class="iconbtn close" data-close="settingsSheet" aria-label="关闭">×</button>
  </div>
  <div class="label">分类</div>
  <ul id="catList" class="catlist"></ul>
  <button id="addCatBtn" class="btn">＋ 分类</button>
  <div class="label">数据</div>
  <div class="sheet-actions">
    <button id="exportBtn" class="btn">导出 JSON</button>
    <button id="importBtn" class="btn">导入 JSON</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
  <p class="hint">数据只存在这台手机里。导出的文件可存到「文件」App 当备份；导入会整个替换。</p>
  <p class="hint" id="verInfo"></p>
</section>

<!-- 只改这天 / 以后都改 -->
<div id="choice" class="modal hidden">
  <div class="modal-box">
    <p id="choiceText">这是重复项</p>
    <button class="btn" data-scope="one">只改这天</button>
    <button class="btn" data-scope="after">这天以后都改</button>
    <button class="btn plain" data-scope="cancel">取消</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
